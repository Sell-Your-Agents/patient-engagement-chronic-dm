# PatientPulse routes for the callingapp-dev.zensark.com server block.
# Installed to /etc/nginx/patientpulse.locations and included from
# /etc/nginx/conf.d/calling-agent.conf (one "include" line). Swaasa's routes are untouched.

# Frontend (static build) — https://callingapp-dev.zensark.com/patientpulse/
location = /patientpulse {
    return 301 /patientpulse/;
}

location /patientpulse/ {
    root /usr/share/nginx/html;
    # Single-page app: unknown paths fall back to index.html
    try_files $uri $uri/ /patientpulse/index.html;
}

# Backend — https://callingapp-dev.zensark.com/patientpulse-api/  ->  127.0.0.1:8010/
# The trailing slash on proxy_pass strips the /patientpulse-api prefix.
location /patientpulse-api/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    # Needed for Twilio media-stream websockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
